<svg xmlns="http://www.w3.org/2000/svg" width="790" height="560" viewBox="0 40 790 560" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <!-- white card, so it reads the same in light and dark mode -->
  <rect x="0" y="40" width="790" height="560" rx="12" fill="#ffffff"/>

  <!-- the main path, top to bottom -->
  <g fill="none">
    <path d="M270 110 V186" stroke="#57606a" stroke-width="3"/>
    <path d="M270 250 V326" stroke="#57606a" stroke-width="3"/>
    <path d="M270 390 V462" stroke="#1a7f37" stroke-width="4.5"/>
  </g>
  <polygon points="262,185 278,185 270,199" fill="#57606a"/>
  <polygon points="262,325 278,325 270,339" fill="#57606a"/>
  <polygon points="259,461 281,461 270,479" fill="#1a7f37"/>
  <g font-size="13" fill="#57606a">
    <text x="284" y="159">RIGHT</text>
    <text x="284" y="299">RIGHT</text>
    <text x="284" y="439" fill="#1a7f37" font-weight="600">RIGHT</text>
  </g>

  <!-- back to LOCKED, one lane each -->
  <g stroke-width="3" fill="none">
    <path d="M340 225 H406 Q420 225 420 211 V114 Q420 100 406 100 H354" stroke="#cf222e"/>
    <path d="M340 365 H546 Q560 365 560 351 V99 Q560 85 546 85 H354" stroke="#cf222e"/>
    <path d="M340 505 H686 Q700 505 700 491 V84 Q700 70 686 70 H354" stroke="#0969da"/>
  </g>
  <polygon points="355,93 355,107 341,100" fill="#cf222e"/>
  <polygon points="355,78 355,92 341,85" fill="#cf222e"/>
  <polygon points="355,63 355,77 341,70" fill="#0969da"/>
  <g font-size="13" text-anchor="middle">
    <rect x="384" y="146" width="72" height="38" fill="#ffffff"/>
    <text x="420" y="161" fill="#cf222e">WRONG</text>
    <text x="420" y="178" fill="#57606a">TIMEOUT</text>

    <rect x="524" y="266" width="72" height="38" fill="#ffffff"/>
    <text x="560" y="281" fill="#cf222e">WRONG</text>
    <text x="560" y="298" fill="#57606a">TIMEOUT</text>

    <rect x="664" y="406" width="72" height="38" fill="#ffffff"/>
    <text x="700" y="421" fill="#0969da">CLOSE</text>
    <text x="700" y="438" fill="#0969da">TIMEOUT</text>
  </g>

  <!-- stays in the same state -->
  <g stroke="#8c959f" stroke-width="2.5" fill="none">
    <path d="M200 72 C150 60, 150 110, 187 100"/>
    <path d="M200 212 C150 200, 150 250, 187 240"/>
    <path d="M200 352 C150 340, 150 390, 187 380"/>
    <path d="M200 492 C150 480, 150 530, 187 520"/>
  </g>
  <g fill="#8c959f">
    <polygon points="185,93 188,106 200,97"/>
    <polygon points="185,233 188,246 200,237"/>
    <polygon points="185,373 188,386 200,377"/>
    <polygon points="185,513 188,526 200,517"/>
  </g>
  <g font-size="13" text-anchor="end" fill="#57606a">
    <text x="146" y="72" fill="#cf222e">WRONG</text>
    <text x="146" y="89">CLOSE, TIMEOUT</text>
    <text x="146" y="104" font-size="11">(already locked)</text>

    <text x="146" y="224">CLOSE</text>
    <text x="146" y="240" font-size="11">(ignored while typing)</text>

    <text x="146" y="364">CLOSE</text>
    <text x="146" y="380" font-size="11">(ignored while typing)</text>

    <text x="146" y="504">RIGHT, WRONG</text>
    <text x="146" y="520" font-size="11">(does nothing while open)</text>
  </g>

  <!-- the states -->
  <g stroke-width="2">
    <rect x="200" y="60" width="140" height="50" rx="10" fill="#f6f8fa" stroke="#57606a"/>
    <rect x="200" y="200" width="140" height="50" rx="10" fill="#f6f8fa" stroke="#57606a"/>
    <rect x="200" y="340" width="140" height="50" rx="10" fill="#f6f8fa" stroke="#57606a"/>
    <rect x="200" y="480" width="140" height="50" rx="10" fill="#dafbe1" stroke="#1a7f37"/>
  </g>
  <g font-size="15" font-weight="700" text-anchor="middle" fill="#1f2328">
    <text x="270" y="90">LOCKED</text>
    <text x="270" y="230">GOT1</text>
    <text x="270" y="370">GOT2</text>
    <text x="270" y="510">OPEN</text>
  </g>

  <!-- key: the color is the action -->
  <g font-size="12" fill="#57606a">
    <text x="40" y="580" font-weight="700" fill="#1f2328">Action:</text>
    <line x1="100" y1="576" x2="124" y2="576" stroke="#1a7f37" stroke-width="4.5"/>
    <text x="132" y="580">UNLOCK</text>
    <line x1="200" y1="576" x2="224" y2="576" stroke="#cf222e" stroke-width="3"/>
    <text x="232" y="580">BEEP</text>
    <line x1="286" y1="576" x2="310" y2="576" stroke="#0969da" stroke-width="3"/>
    <text x="318" y="580">LOCK</text>
    <line x1="370" y1="576" x2="394" y2="576" stroke="#8c959f" stroke-width="3"/>
    <text x="402" y="580">none</text>

  </g>
</svg>
